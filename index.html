<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DAFA打發 活動月曆</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Klee+One:wght@600&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#C4784B;
    --bg-deep:#A85F38;
    --cream:#F4ECDE;
    --rose:#E3C3B6;
    --closed:#D99A7C;
    --ink:#3B2A20;
    --ink-soft:#7A6350;
    --font-main:'Noto Serif TC', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#EFE4D6;
    font-family:'Noto Sans TC', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 14px 60px;
    color:var(--ink);
  }
  .toolbar{
    width:100%;
    max-width:480px;
    display:flex;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .toolbar select, .toolbar button{
    padding:10px 12px;
    border-radius:999px;
    border:1.5px solid var(--ink);
    background:#fff;
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button.primary{
    background:var(--bg);
    color:#fff;
    border-color:var(--ink);
    flex:1;
  }
  .toolbar button:active{ transform:scale(0.97); }

  .save-status{
    max-width:480px;
    width:100%;
    text-align:center;
    font-size:11.5px;
    color:#8a6c4d;
    margin-bottom:10px;
    min-height:16px;
  }

  .panel{
    width:100%;
    max-width:480px;
    background:#fff;
    border:1.5px solid var(--ink);
    border-radius:14px;
    padding:10px 12px;
    margin-bottom:12px;
    font-size:12.5px;
  }
  .panel-title{
    font-weight:700;
    margin-bottom:6px;
    color:var(--bg-deep);
  }
  .color-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .color-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:10.5px;
    color:#5a4433;
  }
  .color-item input[type="color"]{
    width:32px;
    height:32px;
    border:1.5px solid var(--ink);
    border-radius:8px;
    padding:0;
    background:none;
    cursor:pointer;
  }
  .font-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .font-row select{
    flex:1;
    padding:8px 10px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    font-size:13px;
  }

  .hint{
    max-width:480px;
    font-size:12.5px;
    color:#7a5a3f;
    text-align:center;
    margin-bottom:14px;
    line-height:1.7;
  }
  .hint b{ color:var(--bg-deep); }
  .legend{
    display:flex; gap:16px; justify-content:center;
    font-size:12px; color:#7a5a3f; margin-bottom:10px;
  }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .sw{ width:12px; height:12px; border-radius:3px; border:1.5px solid var(--ink); display:inline-block; }
  .sw.closed{ background:var(--closed); }
  .sw.open{ background:var(--cream); }

  #stageWrap{
    width:100%;
    max-width:480px;
    margin:0 auto;
    position:relative;
  }
  #stage{
    width:480px;
    height:480px;
    transform-origin: top left;
  }

  #card{
    width:480px;
    height:480px;
    background:var(--bg);
    border-radius:6px;
    position:relative;
    box-shadow: 0 18px 40px -14px rgba(59,42,32,0.4);
    overflow:hidden;
    font-family:var(--font-main);
  }

  .drag-block{
    position:absolute;
    touch-action:none;
  }
  .drag-handle{
    position:absolute;
    top:-10px; right:-10px;
    width:24px; height:24px;
    background:var(--ink);
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    cursor:grab;
    z-index:20;
    border:2px solid #fff;
    user-select:none;
  }
  .drag-handle:active{ cursor:grabbing; }

  .center-handle{
    position:absolute;
    top:-10px; left:-10px;
    width:24px; height:24px;
    background:#fff;
    color:var(--ink);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    cursor:pointer;
    z-index:20;
    border:2px solid var(--ink);
    user-select:none;
  }
  .center-handle:active{ transform:scale(0.9); }

  #titleBlock{
    left:16px; top:16px; width:448px;
  }
  .title-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:4px 6px 10px;
  }
  .title-box img{
    width:40px;
    height:40px;
    object-fit:contain;
    flex-shrink:0;
  }
  .title-box .brand{
    font-family:var(--font-main);
    font-weight:900;
    font-size:22px;
    color:var(--cream);
    letter-spacing:1px;
    outline:none;
  }
  .title-box .brand .cn{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:500;
    color:rgba(244,236,222,0.85);
    font-size:13px;
    display:block;
    letter-spacing:3px;
    margin-top:2px;
  }

  #calendarBlock{
    left:16px; top:76px; width:448px; height:384px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }

  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    flex-shrink:0;
  }
  .weekday-row div{
    text-align:center;
    color:rgba(244,236,222,0.9);
    font-size:12.5px;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    letter-spacing:1px;
  }

  .grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:1fr;
    gap:3px;
    min-height:0;
    background:rgba(59,42,32,0.25);
    padding:3px;
    border-radius:4px;
  }
  .cell{
    background:var(--cream);
    border-radius:3px;
    position:relative;
    padding:3px 4px 4px;
    display:flex;
    flex-direction:column;
    min-height:0;
    transition:background .12s ease;
  }
  .cell.empty{
    visibility:hidden;
  }
  .cell.closed{
    background:var(--closed);
  }
  .day-num{
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:'Noto Sans TC', sans-serif;
    text-align:right;
    line-height:1;
    flex-shrink:0;
    cursor:pointer;
    padding:1px 2px;
    border-radius:4px;
    align-self:flex-end;
  }
  .day-num:hover{
    background:rgba(59,42,32,0.1);
  }
  .event-text{
    flex:1;
    font-size:11px;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    line-height:1.25;
    outline:none;
    text-align:center;
    padding-top:1px;
    white-space:pre-wrap;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .event-text:empty::before{
    content:attr(data-placeholder);
    color:rgba(59,42,32,0.25);
    font-size:10px;
    font-weight:400;
  }

  #noteBlock{
    left:18px; top:94px; width:140px;
  }
  .note-cell{
    background:rgba(244,236,222,0.92);
    border-radius:4px;
    padding:6px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    text-align:center;
  }
  .note-title{
    font-size:10.5px;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    color:var(--bg-deep);
    outline:none;
    line-height:1.25;
  }
  .note-sub{
    font-size:9.5px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    outline:none;
    line-height:1.3;
  }

  [contenteditable="true"]:hover{ background:rgba(59,42,32,0.08); }
  [contenteditable="true"]:focus{ background:rgba(59,42,32,0.14); }

  .size-tag{
    margin-top:10px;
    font-size:11.5px;
    color:#7a5a3f;
  }

  @media (max-width:500px){
    body{ padding:16px 10px 50px; }
  }
</style>
</head>

  <div class="toolbar">

  for(let y = currentYear-1; y <= currentYear+2; y++){
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y+'年';
    yearSelect.appendChild(opt);
  }
  monthSelect.value = now.getMonth();
  yearSelect.value = currentYear;

  function renderWeekdayRow(){
    const row = document.getElementById('weekdayRow');
    row.innerHTML = '';
    weekNamesMon.forEach(w=>{
      const div = document.createElement('div');
      div.textContent = w;
      row.appendChild(div);
    });
  }

  let dayStore = {};
  let uiState = {
    font: "'Noto Serif TC', serif",
    colors:{ bg:'#C4784B', ink:'#3B2A20', cream:'#F4ECDE', closed:'#D99A7C', rose:'#E3C3B6' },
    positions:{ title:null, note:null, calendar:null },
    brandText: null,
    noteTitle: '咖啡廳營業時間',
    noteSub1: '平日 12:00–19:00',
    noteSub2: '假日 13:00–20:00'
  };

  function isoWeekdayIndex(jsDay){
    return (jsDay + 6) % 7;
  }

  function renderCalendar(){
    const year = parseInt(yearSelect.value);
    const month = parseInt(monthSelect.value);
    const key = year+'-'+month;
    if(!dayStore[key]) dayStore[key] = {};

    const firstJsDay = new Date(year, month, 1).getDay();
    const firstIdx = isoWeekdayIndex(firstJsDay);
    const daysInMonth = new Date(year, month+1, 0).getDate();

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    for(let i=0;i<firstIdx;i++){
      const empty = document.createElement('div');
      empty.className = 'cell empty';
      grid.appendChild(empty);
    }

    let dayCounter = 1;
    const totalSlots = firstIdx + daysInMonth;
    const totalCells = Math.ceil(totalSlots/7)*7;

    for(let i = firstIdx; i < totalSlots; i++){
      const d = dayCounter;
      if(!dayStore[key][d]) dayStore[key][d] = { text:'', closed:false, color: palette[d % palette.length] };
      const state = dayStore[key][d];

      const cell = document.createElement('div');
      cell.className = 'cell' + (state.closed ? ' closed' : '');

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d;
      num.addEventListener('click', ()=>{
        state.closed = !state.closed;
        cell.classList.toggle('closed', state.closed);
        scheduleSave();
      });

      const evt = document.createElement('div');
      evt.className = 'event-text';
      evt.contentEditable = 'true';
      evt.setAttribute('data-placeholder','活動');
      evt.style.color = state.color;
      evt.textContent = state.text;
      evt.addEventListener('input', ()=>{
        state.text = evt.textContent;
        scheduleSave();
      });

      cell.appendChild(num);
      cell.appendChild(evt);
      grid.appendChild(cell);
      dayCounter++;
    }

    const remaining = totalCells - totalSlots;
    for(let i=0;i<remaining;i++){
      const empty = document.createElement('div');
      empty.className = 'cell empty';
      grid.appendChild(empty);
    }
  }

  renderWeekdayRow();

  // ---- font ----
  const fontSelect = document.getElementById('fontSelect');
  fontSelect.addEventListener('change', (e)=>{
    document.documentElement.style.setProperty('--font-main', e.target.value);
    uiState.font = e.target.value;
    scheduleSave();
  });

  // ---- colors ----
  function bindColor(id, varName, stateKey){
    document.getElementById(id).addEventListener('input', (e)=>{
      document.documentElement.style.setProperty(varName, e.target.value);
      uiState.colors[stateKey] = e.target.value;
      scheduleSave();
    });
  }
  bindColor('colorBg','--bg','bg');
  bindColor('colorInk','--ink','ink');
  bindColor('colorCream','--cream','cream');
  bindColor('colorClosed','--closed','closed');
  bindColor('colorRose','--rose','rose');

  // ---- text fields that autosave ----
  document.getElementById('brandText').addEventListener('input', (e)=>{
    uiState.brandText = e.target.innerHTML;
    scheduleSave();
  });
  document.getElementById('noteTitle').addEventListener('input', (e)=>{
    uiState.noteTitle = e.target.textContent;
    scheduleSave();
  });
  document.getElementById('noteSub1').addEventListener('input', (e)=>{
    uiState.noteSub1 = e.target.textContent;
    scheduleSave();
  });
  document.getElementById('noteSub2').addEventListener('input', (e)=>{
    uiState.noteSub2 = e.target.textContent;
    scheduleSave();
  });

  // ---- draggable blocks ----
  function makeDraggable(blockEl, handleEl, posKey){
    let startX=0, startY=0, origLeft=0, origTop=0, dragging=false;
    const card = document.getElementById('card');

    handleEl.addEventListener('pointerdown', (e)=>{
      dragging = true;
      handleEl.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      const rect = blockEl.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();
      origLeft = rect.left - cardRect.left;
      origTop = rect.top - cardRect.top;
      e.preventDefault();
    });
    handleEl.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const newLeft = origLeft + dx;
      const newTop = origTop + dy;
      blockEl.style.left = newLeft + 'px';
      blockEl.style.top = newTop + 'px';
      uiState.positions[posKey] = { left:newLeft, top:newTop };
    });
    handleEl.addEventListener('pointerup', ()=>{ dragging=false; scheduleSave(); });
    handleEl.addEventListener('pointercancel', ()=>{ dragging=false; });
  }

  makeDraggable(document.getElementById('titleBlock'), document.getElementById('titleBlock').querySelector('.drag-handle'), 'title');
  makeDraggable(document.getElementById('noteBlock'), document.getElementById('noteBlock').querySelector('.drag-handle'), 'note');

  // ---- center align ----
  function centerBlock(blockId, posKey){
    const block = document.getElementById(blockId);
    const card = document.getElementById('card');
    const blockWidth = block.getBoundingClientRect().width;
    const cardWidth = card.getBoundingClientRect().width;
    const newLeft = Math.round((cardWidth - blockWidth) / 2);
    block.style.left = newLeft + 'px';
    uiState.positions[posKey] = Object.assign({}, uiState.positions[posKey], { left:newLeft });
    scheduleSave();
  }
  document.querySelectorAll('.center-handle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const targetId = btn.getAttribute('data-target');
      const posKey = targetId === 'titleBlock' ? 'title' : 'note';
      centerBlock(targetId, posKey);
    });
  });

  // ---- autosave (window.storage) ----
  let saveTimer = null;
  const saveStatusEl = document.getElementById('saveStatus');

  function scheduleSave(){
    saveStatusEl.textContent = '儲存中…';
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 600);
  }

  async function doSave(){
    try{
      const payload = { uiState, dayStore };
      await window.storage.set(STORAGE_KEY, JSON.stringify(payload), false);
      saveStatusEl.textContent = '已自動儲存 ✓';
    }catch(err){
      console.error('save error', err);
      saveStatusEl.textContent = '這次自動儲存失敗，內容仍在畫面上，重新整理前請留意';
    }
  }

  async function loadState(){
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      if(result && result.value){
        const payload = JSON.parse(result.value);
        if(payload.uiState) uiState = Object.assign(uiState, payload.uiState);
        if(payload.dayStore) dayStore = payload.dayStore;
      }
    }catch(err){
      // no saved data yet, or read error — start fresh
      console.log('no saved state yet, or read failed', err);
    }
    applyUiState();
    renderCalendar();
  }

  function applyUiState(){
    document.documentElement.style.setProperty('--font-main', uiState.font);
    fontSelect.value = uiState.font;

    document.documentElement.style.setProperty('--bg', uiState.colors.bg);
    document.documentElement.style.setProperty('--ink', uiState.colors.ink);
    document.documentElement.style.setProperty('--cream', uiState.colors.cream);
    document.documentElement.style.setProperty('--closed', uiState.colors.closed);
    document.documentElement.style.setProperty('--rose', uiState.colors.rose);
    document.getElementById('colorBg').value = uiState.colors.bg;
    document.getElementById('colorInk').value = uiState.colors.ink;
    document.getElementById('colorCream').value = uiState.colors.cream;
    document.getElementById('colorClosed').value = uiState.colors.closed;
    document.getElementById('colorRose').value = uiState.colors.rose;

    if(uiState.brandText) document.getElementById('brandText').innerHTML = uiState.brandText;
    document.getElementById('noteTitle').textContent = uiState.noteTitle;
    document.getElementById('noteSub1').textContent = uiState.noteSub1;
    document.getElementById('noteSub2').textContent = uiState.noteSub2;

    if(uiState.positions.title){
      document.getElementById('titleBlock').style.left = uiState.positions.title.left + 'px';
      document.getElementById('titleBlock').style.top = uiState.positions.title.top + 'px';
    }
    if(uiState.positions.note){
      document.getElementById('noteBlock').style.left = uiState.positions.note.left + 'px';
      document.getElementById('noteBlock').style.top = uiState.positions.note.top + 'px';
    }
  }

  monthSelect.addEventListener('change', renderCalendar);
  yearSelect.addEventListener('change', renderCalendar);

  loadState();

  document.getElementById('downloadBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('downloadBtn');
    const originalText = btn.textContent;
    btn.textContent = '產生圖片中…';
    btn.disabled = true;
    try{
      document.querySelectorAll('[contenteditable]').forEach(el=>el.blur());
      const card = document.getElementById('card');
      const canvas = await html2canvas(card, {
        scale: 2.25,
        backgroundColor: '#ffffff', useCORS:true,
        ignoreElements: (el)=> el.classList && (el.classList.contains('drag-handle') || el.classList.contains('center-handle'))
      });
      const year = yearSelect.value, month = monthNamesCn[monthSelect.value];
      const filename = `DAFA打發-活動月曆-${year}${month}-IG.png`;

      canvas.toBlob((blob)=>{
        if(!blob){ fallbackShowImage(canvas.toDataURL('image/png')); return; }
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = filename;
        link.href = blobUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(()=>{ fallbackShowImage(blobUrl); URL.revokeObjectURL(blobUrl); }, 400);
      }, 'image/png');

    }catch(err){
      console.error(err);
      alert('產生圖片時發生問題：' + err.message);
    }finally{
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });

  function fallbackShowImage(dataUrlOrBlobUrl){
    const win = window.open('', '_blank');
    if(!win){
      alert('瀏覽器擋住了新分頁，請允許彈出視窗後再試一次。');
      return;
    }
    win.document.write(`
      <html>
        <head><title>活動月曆圖片</title></head>
        <body style="margin:0;background:#222;display:flex;flex-direction:column;align-items:center;padding:16px;font-family:sans-serif;">
          <p style="color:#fff;font-size:14px;margin-bottom:12px;">長按下方圖片，選擇「儲存圖片」即可存到相簿</p>
          <img src="${dataUrlOrBlobUrl}" style="max-width:100%;border-radius:12px;" />
        </body>
      </html>
    `);
  }
</script>
</body>
</html>
